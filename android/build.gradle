buildscript {
  // Only needed when this library is built standalone; a React Native app already provides AGP + KGP.
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
      maven { url 'https://jitpack.io' }
    }
    dependencies {
      classpath "com.android.tools.build:gradle:8.7.2"
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    }
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: '../nitrogen/generated/android/NitroSpeakerId+autolinking.gradle'

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroSpeakerId_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroSpeakerId_" + name]).toInteger()
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
  namespace "com.margelo.nitro.nitrospeakerid"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")
  ndkVersion getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  packagingOptions {
    excludes = [
        "META-INF",
        "META-INF/**",
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
    ]
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  buildFeatures {
    prefab true
  }
 
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
 
  // TFLite .tflite files ship as raw model data. Don't compress them in the
  // AAR — TFLite mmaps them at load time and compressed models can't be
  // mmapped. Consuming app is free to compress at APK level if needed.
  aaptOptions {
    noCompress += ["tflite"]
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation "com.facebook.react:react-android"

  implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

  implementation project(":react-native-nitro-modules")

  implementation "com.google.ai.edge.litert:litert:2.1.0"

  implementation 'com.github.wendykierp:JTransforms:3.1'
}
